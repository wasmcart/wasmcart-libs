name: Release package

on:
  push:
    tags:
      - "box2d-*"
      - "box3d-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore WASI SDK cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: wasi-sdk-33.0-linux-x86_64

      - name: Select package
        id: package
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            box2d-*) echo "name=box2d" >> "$GITHUB_OUTPUT" ;;
            box3d-*) echo "name=box3d" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Rebuild and verify
        shell: bash
        run: |
          scripts/bootstrap-wasi-sdk.sh
          scripts/verify-reproducible.sh "${{ steps.package.outputs.name }}"
          scripts/link-smoke.sh "${{ steps.package.outputs.name }}"
          scripts/package-release.sh "${{ steps.package.outputs.name }}"
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            dist/*.tar.gz \
            dist/SHA256SUMS

