name: Release package

on:
  push:
    tags:
      - "*-wc[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore WASI SDK cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: wasi-sdk-33.0-linux-x86_64

      - name: Select package
        id: package
        shell: bash
        run: |
          for package_dir in packages/*; do
            package="${package_dir##*/}"
            version="$(sed -n 's/^package_version = "\(.*\)"/\1/p' "$package_dir/package.toml")"
            if [[ "$GITHUB_REF_NAME" == "$package-$version" ]]; then
              echo "name=$package" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No package matches release tag: $GITHUB_REF_NAME" >&2
          exit 1

      - name: Rebuild and verify
        shell: bash
        run: |
          scripts/bootstrap-wasi-sdk.sh
          scripts/verify-reproducible.sh "${{ steps.package.outputs.name }}"
          scripts/link-smoke.sh "${{ steps.package.outputs.name }}"
          scripts/package-release.sh "${{ steps.package.outputs.name }}"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            dist/*
